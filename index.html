<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUNJAB AI - Real Voice AI</title>
<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:white;text-align:center}
.header{background:linear-gradient(90deg,#ff6600,#fff,#138808);padding:12px;color:#000;font-weight:bold}
.main{padding:12px}
h1{color:#00ffcc;font-size:32px;margin:10px}
.chatbox{background:white;color:black;padding:12px;border-radius:15px;text-align:left}
#chat{height:320px;overflow-y:auto;background:#f5f5f5;padding:10px;border-radius:10px;margin-bottom:10px}
.msg{padding:12px;border-radius:12px;margin:8px 0;max-width:92%;line-height:1.5}
.user{background:#00ffcc;color:#000;margin-left:auto;text-align:right;font-weight:bold}
.ai{background:white;border:1px solid #ddd;color:#111}
.row{display:flex;gap:6px}
input{flex:1;padding:12px;border-radius:10px;border:1px solid #ccc}
.btnS{padding:12px 16px;background:#00ffcc;border:none;border-radius:10px;font-weight:bold}
.btnV{padding:6px 10px;background:#eee;border:none;border-radius:8px;margin-top:6px}
.btn{padding:12px 24px;border-radius:50px;border:none;font-weight:bold;margin:5px}
.btnW{background:white;color:black}
</style>
</head>
<body>
<div class="header">🇮🇳 PUNJAB AI - ਬੋਲਣ ਵਾਲਾ ਅਸਲੀ AI - Mansa</div>
<div class="main">
<h1>🤖 PUNJAB AI 🦁</h1>
<p>ਪੰਜਾਬ AI - ਵੈਲਕਮ, ਸਵਾਗਤ ਹੈ ਤੁਹਾਡਾ!</p>
<div class="chatbox">
<div id="chat">
<div class="msg ai">🤖 ਸਤਿ ਸ੍ਰੀ ਅਕਾਲ ਜੀ! ਮੈਂ Punjab AI ਹਾਂ। ਕੋਈ ਵੀ ਸਵਾਲ ਪੁੱਛੋ - ਪੰਜਾਬੀ, ਹਿੰਦੀ, English। ਮੈਂ ਉਸੇ ਭਾਸ਼ਾ ਵਿੱਚ ਬੋਲ ਕੇ ਜਵਾਬ ਦੇਵਾਂਗਾ!</div>
</div>
<div class="row">
<input id="q" placeholder="ਇੱਥੇ ਲਿਖੋ... ਜਿਵੇਂ ਪੰਜਾਬ ਵਿੱਚ ਕਿੰਨੇ ਜ਼ਿਲੇ ਹਨ?">
<button class="btnS" onclick="askAI()">ਭੇਜੋ</button>
</div>
</div>
<br>
<button class="btn btnW" onclick="window.open('https://wa.me/?text=Punjab%20AI%20Voice%20AI%20https://satnamsinghsatnam028-coder.github.io/punjabi-ai/','_blank')">📲 WhatsApp Share</button>
<p style="color:#888">Made with ❤️ in Mansa</p>
</div>
<script>
let lastAnswer="";
function speak(text){
if('speechSynthesis' in window){
speechSynthesis.cancel();
let u=new SpeechSynthesisUtterance(text);
let lang='pa-IN';
if(/[\u0900-\u097F]/.test(text)) lang='hi-IN';
else if(/[a-zA-Z]/.test(text) && !/[ਅ-ਔ]/.test(text)) lang='en-IN';
u.lang=lang; u.rate=0.9;
speechSynthesis.speak(u);
}
}
async function askAI(){
let input=document.getElementById('q');
let chat=document.getElementById('chat');
let text=input.value.trim();
if(!text) return;
chat.innerHTML+=`<div class="msg user">${text}</div>`;
input.value='';
let id='a'+Date.now();
chat.innerHTML+=`<div class="msg ai" id="${id}">🤖 ਸੋਚ ਰਿਹਾ ਹਾਂ, Internet ਤੋਂ ਜਵਾਬ ਲਿਆ ਰਿਹਾ ਹਾਂ...</div>`;
chat.scrollTop=chat.scrollHeight;
try{
let prompt=`You are Punjab AI from Mansa Punjab. Answer accurately with real facts from internet. Question: ${text}. Rules: 1. Reply in SAME language as question (Punjabi if asked in Punjabi, Hindi if Hindi, English if English). 2. Do NOT repeat the question. 3. Give short, correct answer. 4. For Punjab districts, answer 23 districts (as of 2026).`;
let res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt));
let data=await res.text();
if(!data || data.length<5) throw new Error('empty');
lastAnswer=data;
document.getElementById(id).innerHTML=`🤖 ${data}<br><button class="btnV" onclick="speak(\`${data.replace(/`/g,'').replace(/"/g,'')}\`)">🔊 ਬੋਲ ਕੇ ਸੁਣੋ</button>`;
speak(data);
}catch(e){
document.getElementById(id).innerHTML=`🤖 ਮਾਫ ਕਰਨਾ ਜੀ, Internet slow ਹੈ। ਦੁਬਾਰਾ Try ਕਰੋ। ਜੇ ਪੰਜਾਬ ਦੇ ਜ਼ਿਲਿਆਂ ਬਾਰੇ ਪੁੱਛਿਆ ਤਾਂ - ਪੰਜਾਬ ਵਿੱਚ 23 ਜ਼ਿਲੇ ਹਨ (2026 ਤੱਕ)।<br><button class="btnV" onclick="speak('ਪੰਜਾਬ ਵਿੱਚ 23 ਜ਼ਿਲੇ ਹਨ')">🔊 ਬੋਲ ਕੇ ਸੁਣੋ</button>`;
}
chat.scrollTop=chat.scrollHeight;
}
document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter') askAI();});
</script>
</body>
</html>
